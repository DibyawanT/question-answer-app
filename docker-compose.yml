# Fixed project name so the database volume stays the same whatever the folder is called.
name: xat-prep

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
    volumes:
      - data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  data:
  caddy:
